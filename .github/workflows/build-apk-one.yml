name: Build one Android test APK
on:
  workflow_dispatch:
  push:
    tags:
      - twinlevel-v*
      - sensorlink-v*
      - syncmark-v*
      - soundrace-v*
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [twinlevel, sensorlink, syncmark, soundrace]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Install Android API 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build web app
        run: npx vite build --outDir "dist/${{ matrix.app }}"
        env:
          VITE_APP_ID: ${{ matrix.app }}
      - name: Prepare Android project
        run: |
          rm -rf android
          cp -R android-base android
          chmod +x android/gradlew
          NAME=$(node -e "const a=require('./apps.json').find(x=>x.id==='${{ matrix.app }}'); if(!a) process.exit(1); process.stdout.write(a.name)")
          MOBILE_APP_ID="${{ matrix.app }}" MOBILE_APP_NAME="$NAME" VITE_APP_ID="${{ matrix.app }}" npx cap sync android
      - name: Build and verify APK
        run: node scripts/build-android-one.mjs
        env:
          APP_ID: ${{ matrix.app }}
      - name: Record checksum
        run: |
          APP="${{ matrix.app }}"
          APK=$(ls release/apk/${APP}-*.apk)
          sha256sum "$APK" | tee "release/${APP}.sha256"
          wc -c "$APK" | tee "release/${APP}.size"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: |
            release/apk/*.apk
            release/*.sha256
            release/*.size
            release/*-manifest.json
          if-no-files-found: error
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP="${{ matrix.app }}"
          TAG="${APP}-v1.0.1"
          APK=$(ls release/apk/${APP}-*.apk)
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(wc -c < "$APK")
          NOTES=$(printf '%s\n' \
            "APK de test debug. Pas une build signée Play Store." \
            "Construit par GitHub Actions depuis ${GITHUB_SHA}." \
            "SHA-256: ${SHA}" \
            "Taille: ${SIZE} octets." \
            "Package: com.phablabphone.${APP}" \
            "Aucun téléphone physique n'a exécuté cet APK.")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" "$APK" --prerelease --title "${APP} ${TAG}" --notes "$NOTES"
          fi

name: Build one Android test APK
on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Mini-app id
        required: true
        type: choice
        options:
          - twinlevel
          - sensorlink
          - syncmark
          - soundrace
  push:
    tags:
      - twinlevel-v*
      - sensorlink-v*
      - syncmark-v*
      - soundrace-v*
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve app id
        id: app
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "id=${{ inputs.app_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Install Android API 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build web app
        run: npx vite build --outDir "dist/${{ steps.app.outputs.id }}"
        env:
          VITE_APP_ID: ${{ steps.app.outputs.id }}
      - name: Prepare Android project
        run: |
          rm -rf android
          cp -R android-base android
          chmod +x android/gradlew
          NAME=$(node -e "const a=require('./apps.json').find(x=>x.id==='${{ steps.app.outputs.id }}'); if(!a) process.exit(1); process.stdout.write(a.name)")
          MOBILE_APP_ID="${{ steps.app.outputs.id }}" MOBILE_APP_NAME="$NAME" VITE_APP_ID="${{ steps.app.outputs.id }}" npx cap sync android
      - name: Build and verify APK
        run: node scripts/build-android-one.mjs
        env:
          APP_ID: ${{ steps.app.outputs.id }}
      - name: Record checksum
        run: |
          APP="${{ steps.app.outputs.id }}"
          APK=$(ls release/apk/${APP}-*.apk)
          echo "apk=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK" | tee release/${APP}.sha256
          wc -c "$APK" | tee release/${APP}.size
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.id }}-apk
          path: |
            release/apk/*.apk
            release/*.sha256
            release/*.size
            release/*-manifest.json
          if-no-files-found: error
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP="${{ steps.app.outputs.id }}"
          APK=$(ls release/apk/${APP}-*.apk)
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(wc -c < "$APK")
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --prerelease \
            --title "${APP} ${GITHUB_REF_NAME}" \
            --notes "$(printf '%s\n' "APK de test debug, non signé pour le Play Store." "SHA-256: ${SHA}" "Taille: ${SIZE} octets." "Compilation GitHub Actions. Aucun téléphone physique n'a servi à produire ce fichier." "Package attendu: com.phablabphone.${APP}")"

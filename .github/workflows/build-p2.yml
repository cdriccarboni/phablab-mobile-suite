name: P2 — tests, web et Android
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'grok/phablab-p2-finalisation-*'
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'apps.json'
      - 'package*.json'
      - 'android-base/**'
      - 'store/play/**'
      - '.github/workflows/build-p2.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dépendances
        run: npm ci
      - name: Tests unitaires
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build web des apps
        run: npm run build:all
      - name: SDK Android 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: assembleDebug et bundleRelease des 12 apps P2
        run: node scripts/build-p2-android.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: phablab-p2-apk-aab
          path: |
            release/apk/*
            release/aab/*
            release/p2-report.json
          if-no-files-found: error
